spring:
  profiles:
    active: dev
  application:
    name: bank-transfer-api
  data:
    mongodb:
      uri: mongodb://localhost:27017/bank_transfers
      connect-timeout: 5000
      socket-timeout: 5000
      server-selection-timeout: 5000

server:
  port: 8080
  reactive:
    session:
      timeout: 30m

logging:
  level:
    com.bank.transfer: DEBUG
    org.springframework.data.mongodb: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"